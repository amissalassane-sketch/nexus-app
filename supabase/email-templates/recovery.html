<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>NEXUS — Reset your password</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #000000;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
        Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #000000"
    >
      <tr>
        <td align="center" style="padding: 48px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 420px;
              width: 100%;
              border: 1px solid rgba(255, 255, 255, 0.1);
              border-radius: 16px;
              background-color: #000000;
            "
          >
            <tr>
              <td style="padding: 40px 32px 24px; text-align: center">
                <span
                  style="
                    font-size: 13px;
                    font-weight: 600;
                    letter-spacing: -0.03em;
                    text-transform: uppercase;
                    color: #ffffff;
                  "
                  >NEXUS</span
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 8px; text-align: center">
                <h1
                  style="
                    margin: 0;
                    font-size: 22px;
                    line-height: 28px;
                    font-weight: 600;
                    letter-spacing: -0.025em;
                    color: #ffffff;
                  "
                >
                  Reset your password
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 24px; text-align: center">
                <p
                  style="
                    margin: 0;
                    font-size: 13.5px;
                    line-height: 21px;
                    color: rgba(255, 255, 255, 0.65);
                  "
                >
                  We received a request to reset your NEXUS password.
                </p>
                <p
                  style="
                    margin: 12px 0 0;
                    font-size: 13.5px;
                    line-height: 21px;
                    color: rgba(255, 255, 255, 0.65);
                  "
                >
                  Choose a new password to regain access to your workspace.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 28px; text-align: center">
                <a
                  href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
                  style="
                    display: inline-block;
                    background-color: #ffffff;
                    color: #000000;
                    font-size: 13px;
                    font-weight: 500;
                    line-height: 20px;
                    text-decoration: none;
                    border-radius: 8px;
                    padding: 12px 24px;
                  "
                  >Reset password</a
                >
              </td>
            </tr>
            <tr>
              <td style="padding: 0 32px 28px; text-align: center">
                <p
                  style="
                    margin: 0;
                    font-size: 12.5px;
                    line-height: 18px;
                    color: rgba(255, 255, 255, 0.65);
                  "
                >
                  This reset link expires for security reasons.
                </p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 20px 32px 32px;
                  border-top: 1px solid rgba(255, 255, 255, 0.1);
                  text-align: center;
                "
              >
                <p
                  style="
                    margin: 0;
                    font-size: 12.5px;
                    line-height: 18px;
                    color: rgba(255, 255, 255, 0.65);
                  "
                >
                  If you didn't request this, you can safely ignore this email.
                </p>
                <p
                  style="
                    margin: 20px 0 0;
                    font-size: 11.5px;
                    line-height: 16px;
                    text-transform: uppercase;
                    letter-spacing: -0.03em;
                    color: rgba(255, 255, 255, 0.45);
                  "
                >
                  © NEXUS
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
